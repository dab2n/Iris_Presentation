<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRIS 발표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 피그마 폰트는 맥에 설치된 로컬 폰트를 그대로 쓴다 (웹폰트 대체 시 줄바꿈 어긋남) */
@font-face { font-family: KR; font-weight: 500; src: local("SFProKR-Medium"), local("SFProKRDisplay-Medium"); }
@font-face { font-family: KR; font-weight: 600; src: local("SFProKR-Semibold"), local("SFProKRDisplay-Semibold"); }
@font-face { font-family: KR; font-weight: 700; src: local("SFProKR-Bold"), local("SFProKRDisplay-Bold"); }
@font-face { font-family: Aeonik; font-weight: 500; src: local("Aeonik_OVERVIEW-Medium"); }
@font-face { font-family: HND; font-weight: 500; src: local("HelveticaNowDisplay-Medium"); }

:root {
  --blue: #98c5e4; --ink: #22232a; --olive: #c1c898; --black: #0c0c0c;
  --ease: cubic-bezier(.22, 1, .36, 1); /* 오버슈트 없이 부드럽게 감속 */
  --dur: 800ms;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  background: #fcfcfc; overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  font-family: KR, Pretendard, sans-serif; font-weight: 500; color: var(--black);
}
.abs { position: absolute; }
/* 2→3 전환: 2 가 제자리에서 위로 살짝 늘어나고, 곧바로 3 이 아래에서 덮으며 올라옴 */
.slide { position: absolute; inset: 0; }
/* 2→3: 2 의 그래프만 제자리에서 위로 살짝 늘어남 → 3 으로 바로 컷 → 3 의 요소들이 아래에서 올라와 자리 잡음 */
.slide:not(.on) { visibility: hidden; }
#chartSlide.stretch .bars { transform: scaleY(1.12); transition: transform 220ms cubic-bezier(.5, 0, 1, 1); } /* 가속하다가 멈추기 전에 컷 */
.bars { transform-origin: 50% 100%; }
#stage.ready #s3.on .rise { animation: rise 700ms var(--ease) both; animation-delay: var(--r, 0ms); }
@keyframes rise { from { opacity: 0; translate: 0 80px; } }
/* 위쪽 Insight 는 아래 그래픽이 다 들어온 뒤 위에서 아래로 */
#stage.ready #s3.on .drop { animation: drop 700ms var(--ease) both; animation-delay: var(--r, 0ms); }
@keyframes drop { from { opacity: 0; translate: 0 -30px; } }
/* 패턴: 아래 줄부터 한 줄씩 다다닥 차오름 (줄 간격 17.82px, 16단계) */
#stage.ready #s3.on .crosses { animation: fillUp 560ms steps(16, jump-none) 420ms both; }
@keyframes fillUp { from { clip-path: inset(266.96px 0 0 0); } to { clip-path: inset(0 0 0 0); } }

/* 레이아웃 그리드 오버레이 (G 키) — 피그마: 5열 · 마진 120 · 거터 20 */
#grid { position: absolute; inset: 0; z-index: 9; pointer-events: none; display: none;
  background:
    repeating-linear-gradient(90deg, rgba(255,0,0,.1) 0 320px, transparent 320px 340px) 120px 0 / 1680px 100% no-repeat; }
#stage.grid #grid { display: block; }

/* ── 공통 텍스트 ── */
.eyebrow { top: 79px; left: calc(50% - .5px); transform: translateX(-50%);
  font-size: 24px; line-height: 1.4; letter-spacing: -.96px; white-space: nowrap; }
.title { left: calc(50% - 2px); transform: translateX(-50%); text-align: center;
  font-size: 64px; letter-spacing: -2.56px; white-space: nowrap; }
.title p { white-space: pre; }
.title b { font-weight: 700; }

/* ── 슬라이드 1·2 : 같은 도형을 스마트 애니메이트 ── */
#chartSlide .band { left: 0; top: 448px; width: 1920px; height: 632px; background: #f5f5f5; }
#chartSlide .eyebrow { color: #848484; }
#chartSlide .title { top: 167px; line-height: 1.3; }
/* 바뀐 글자만 제자리에서 다시 써짐: 옛 글자는 사라지고 새 글자가 왼쪽부터 한 자씩. 공통 글자는 그대로 */
.swap { display: inline-grid; vertical-align: top; transition: width 300ms cubic-bezier(.16, 1, .3, 1); }
.swap > * { grid-area: 1 / 1; justify-self: start; white-space: pre; transition: opacity 150ms ease; }
.swap > :not(.on) { opacity: 0; }
#stage.ready .swap > .on .ch { animation: write 200ms ease both; animation-delay: calc(120ms + var(--i) * 35ms); }
@keyframes write { from { opacity: 0; } }

.legend { left: 120px; display: flex; gap: 12px; align-items: center;
  font-family: HND, "Apple SD Gothic Neo", Pretendard, sans-serif; font-size: 20px; letter-spacing: -.4px; color: #bebebe; }
.legend i { width: 24px; height: 24px; }

.chart { left: 120px; top: 706px; display: flex; }
.col { position: relative; width: 336px; }
.bars { position: relative; height: 187.765px; overflow: hidden; }
.col + .col .bars { box-shadow: -1px 0 0 #f4f8fb; transition: box-shadow var(--dur); } /* 피그마 구분선은 칸 바로 왼쪽 1px */
[data-state="1"] .col + .col .bars { box-shadow: -1px 0 0 #fff; }
.seg { position: absolute; left: 0; right: 0;
  transition: top var(--dur) var(--ease), bottom var(--dur) var(--ease),
              height var(--dur) var(--ease), background-color 600ms ease;
  transition-delay: var(--d, 0ms); } /* --d: 글자가 먼저 바뀐 뒤, 왼쪽 칸부터 차례로 */
.seg.p { top: 0; background: var(--blue); }
[data-state="1"] .seg.p { background: rgba(152,197,228,.19); }
.seg.n { background: var(--ink); }
.seg.m { bottom: 0; background: var(--olive); }
.col .label { margin-top: 14.5px; font-family: "Apple SD Gothic Neo", Pretendard, sans-serif; font-weight: 500; font-size: 28.607px; line-height: 1.5; } /* 피그마는 한글 대체 글꼴에 자간을 안 먹임 */
.pct { position: absolute; font-family: Aeonik, HND, Pretendard, sans-serif; font-size: 28.607px; letter-spacing: -.5721px;
  color: var(--ink); white-space: nowrap;
  transition: left var(--dur) var(--ease) var(--d, 0ms), top var(--dur) var(--ease) var(--d, 0ms), color 300ms ease; }

/* ── 슬라이드 3 ── */
#s3 { background: #f5f5f5; }
#s3 .panel { left: 0; top: 456px; width: 1920px; height: 624px; background: #fcfcfc; }
#s3 .eyebrow { color: #575757; }
#s3 .title { top: 157px; font-weight: 600; line-height: 1.5; }
#s3 .rule { left: -26px; width: 1972px; height: 1px; margin-top: -.5px; background: #848484; }
#s3 .blk { left: 0; width: 440px; }
#s3 .big { left: 460px; font-family: Aeonik, Pretendard, sans-serif; font-size: 68px; letter-spacing: -2.04px; white-space: nowrap; }
#s3 .note { left: 460px; width: 507px; font-family: "SF Pro Display", "Apple SD Gothic Neo", Pretendard, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.4; color: #8a8a8a; }

/* ── 4~6: 관계 맵 (피그마에서 내보낸 레이어 이미지를 겹쳐 움직임) ── */
#map { background: #f4f8fb; }
#map img { position: absolute; display: block; max-width: none; }
/* 4→5: 첫 장의 작은 기기 화면이 제자리로 커지며 자리 잡음 */
#dev { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transition: transform 900ms var(--ease); }
#map[data-step="intro"] #dev { transform: translate(71.333px, 110.889px) scale(.925926); }
#map.snap, #map.snap * { transition: none !important; animation: none !important; }
#left { left: 368px; top: 292px; width: 416px; height: 668px; overflow: hidden; }
#win { left: 23.5px; top: 54px; width: 393px; height: 619px; overflow: hidden; background: #fff; }
#win .thumb { left: 383.5px; top: 0; width: 4px; height: 27px; border-radius: 2px; background: #b5b9c0; }
#left .shade { left: -1px; top: 587px; width: 418px; height: 82px; background: #fff; box-shadow: 0 -23.325px 41.985px #fff; }
#board { left: 803px; top: 416px; width: 810px; height: 520px; border-radius: 23.33px; overflow: hidden; }
#board .glow { left: 19.63px; top: 369.64px; width: 770.757px; height: 284.368px; }
#map .guideSet { opacity: 0; }
@font-face { font-family: HNDR; font-weight: 400; src: local("HelveticaNowDisplay-Regular"); }
#left .pbar { position: absolute; width: 103.8px; height: 7px; background: rgb(197, 209, 232); }
#left .ptime { position: absolute; font: 400 11.66px/17px HNDR, Pretendard, sans-serif; color: #a3a3a3; white-space: nowrap; }
#cur { left: 1327px; top: 804.5px; width: 35.4577px; height: 36.1523px; }
#cur img { left: 0; top: 0; width: 100%; height: 100%; transform: rotate(-36.34deg); }
#map .cardOn, #map .listB, #map .stripB, #map .listBlur { opacity: 0; }

/* 5→6 끝 상태 (애니메이션 없이 바로 열었을 때도 이 모습) */
#map[data-step="flow"] #cur { translate: -122.12px -131.74px; }
#map[data-step="flow"] .listB, #map[data-step="flow"] .stripB { opacity: 1; }
#map[data-step="flow"] .listMove { translate: 0 -2136.5px; }
#map[data-step="flow"] .thumb { top: 153px; width: 5px; height: 28px; }

/* 5→6 흐름 (6.6초): '실시간 확인하기' 쪽으로 줌인 → 하단 안내가 일렁이며 등장 → 원래 크기로 줌아웃
   → 커서가 카드로 → 클릭 → 원문이 스르륵 내려가 해당 발언을 찾고 하이라이트 */
#stage.ready #map[data-step="flow"] #dev { animation: cam 6600ms linear both; }
@keyframes cam {
  0% { transform: none; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
  13.64%, 39.39% { transform: translate(-1698.7px, -1365.2px) scale(2.2); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
  53.03%, 100% { transform: none; }
}
#stage.ready #map[data-step="flow"] .guideSet { animation: guide 6600ms linear both; }
#board .glowRise { position: absolute; inset: 0; }
#stage.ready #map[data-step="flow"] :is(.gPill, .gText) { animation-name: guideText; } /* 빛이 다 올라온 뒤 버튼 → 문구 */
#stage.ready #map[data-step="flow"] .gText { animation-delay: 220ms; }
@keyframes guide { /* 빛: 아래에서 위로 올라옴 */
  0%, 10.61% { opacity: 0; translate: 0 140px; animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
  24.24% { opacity: 1; translate: 0 0; }
  72.73% { opacity: 1; animation-timing-function: ease; }
  80.30%, 100% { opacity: 0; }
}
@keyframes guideText { /* 버튼·안내 문구: 빛 뒤에 제자리에서 나타남 */
  0%, 21.21% { opacity: 0; translate: 0 18px; animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
  29.55% { opacity: 1; translate: 0 0; }
  72.73% { opacity: 1; animation-timing-function: ease; }
  80.30%, 100% { opacity: 0; }
}
#board .glow { animation: sway 3.4s ease-in-out infinite alternate; transform-origin: 50% 50%; }
@keyframes sway { /* 일렁임: 좌우로 흘러가며 위아래로 숨 쉬듯 */
  0% { transform: translateX(-18px) scale(1.05, .9); }
  50% { transform: translateX(6px) scale(.97, 1.08); }
  100% { transform: translateX(18px) scale(1.02, .94); }
}
#stage.ready #map[data-step="flow"] #cur { animation: cursor 6600ms linear both; }
@keyframes cursor {
  0%, 54.55% { translate: 0 0; scale: 1; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
  68.18%, 71.21% { translate: -119.73px -136.37px; scale: 1; animation-timing-function: ease-out; }
  73.03% { translate: -120.9px -134px; scale: .86; animation-timing-function: ease-out; }
  74.85%, 100% { translate: -122.12px -131.74px; scale: 1; }
}
#stage.ready #map[data-step="flow"] .cardOn { animation: cardIn 6600ms linear both; }
#stage.ready #map[data-step="flow"] .stripB { animation: stripIn 6600ms linear both; }
#stage.ready #map[data-step="flow"] .listB { animation: hiIn 6600ms linear both; }
@keyframes cardIn { /* 누르는 순간 눌린 모습 → 떼면 원래 카드로 */ 0%, 71.21% { opacity: 0; animation-timing-function: ease-out; } 72.73%, 74.85% { opacity: 1; animation-timing-function: ease; } 79.55%, 100% { opacity: 0; } }
@keyframes stripIn { 0%, 74.24% { opacity: 0; animation-timing-function: ease; } 78.79%, 100% { opacity: 1; } }
@keyframes hiIn { 0%, 93.94% { opacity: 0; animation-timing-function: ease; } 99.24%, 100% { opacity: 1; } }
/* 원문: 여러 발언을 건너뛰듯 빠르게 내려갔다가 해당 발언에서 부드럽게 멈춤 */
#stage.ready #map[data-step="flow"] .listMove { animation: scrollList 6600ms linear both; }
@keyframes scrollList { 0%, 74.24% { translate: 0 0; animation-timing-function: cubic-bezier(.55, 0, .1, 1); } 93.94%, 100% { translate: 0 -2136.5px; } }
#stage.ready #map[data-step="flow"] .listBlur { animation: blurOn 6600ms linear both; }
@keyframes blurOn { 0%, 75.00% { opacity: 0; } 79.55%, 85.61% { opacity: 1; } 90.91%, 100% { opacity: 0; } }
#stage.ready #map[data-step="flow"] .thumb { animation: thumb 6600ms linear both; }
@keyframes thumb { 0%, 74.24% { top: 0; width: 4px; height: 27px; animation-timing-function: cubic-bezier(.45, 0, .2, 1); } 93.94%, 100% { top: 153px; width: 5px; height: 28px; } }

/* ── 4~7: 그리드 시스템 (g1 대지 → 축 그리기 → g2 유동 그리드 → g3 미리보기 카드 → g4 실제 UI + 연결선) ── */
#gs { background: #f4f8fb; }
#gs img { position: absolute; display: block; max-width: none; }
#gb { left: 448px; top: 280px; width: 1049.63px; height: 672.86px; border-radius: 30.24px; overflow: hidden; background: #fff; transition: left 900ms var(--ease), background-color 900ms ease; }
#gs:is([data-step="g3"], [data-step="g4"]) #gb { background: #e9ecf0; } /* 미리보기부터 회색 대지 */
#gb::after { content: ""; position: absolute; inset: 0; border: 1.512px solid #f0f0f0; border-radius: inherit; pointer-events: none; z-index: 5; }
#gs:not([data-step="g1"]) #gb { left: 435px; }
#gb .row, #gb .col { position: absolute; background: rgba(255, 148, 148, .16); }
#gb .row { left: 0; width: 1050px; height: 138px; }
#gb .col { top: 0; width: 236px; height: 672px; }
#gs .r1 { top: 40px; } #gs .r2 { top: 190px; } #gs .r3 { top: 340px; } #gs .r4 { top: 490px; }
#gs:not([data-step="g1"]) .r1 { top: 40px; height: 60px; } #gs:not([data-step="g1"]) .r2 { top: 113px; height: 151px; }
#gs:not([data-step="g1"]) .r3 { top: 282px; height: 130px; } #gs:not([data-step="g1"]) .r4 { top: 430px; height: 130px; }
#gs:is([data-step="g3"], [data-step="g4"]) :is(.row, .col) { opacity: 0; }
#gb .pv { position: absolute; border-radius: 18.1px; background: rgba(100, 113, 133, .2); opacity: 0; }
#gs[data-step="g3"] .pv { opacity: 1; }
#gb .fin, #gb .ln, #gb .card { opacity: 0; }
#gs[data-step="g4"] :is(.fin, .ln, .card) { opacity: 1; }
#gb .card { position: absolute; }
#gb .card img { position: absolute; }
#gb .pv .sk { position: absolute; border-radius: 4px; }
.axis { overflow: hidden; }
.axis i { position: absolute; background: #bfc4c8; }
.axis svg { position: absolute; }
#gs .ax { left: 475px; top: 253.37px; width: 1024.8px; height: 13.26px; }
#gs .ax i { left: 0; right: 7px; top: 5.73px; height: 1.8px; }
#gs .ax svg { right: 0; top: 0; }
#gs .ay { left: 421.37px; top: 320px; width: 13.26px; height: 633.8px; }
#gs .ay i { top: 0; bottom: 7px; left: 5.73px; width: 1.8px; }
#gs .ay svg { bottom: 0; left: 0; transform: rotate(90deg); transform-origin: 6.63px 6.63px; translate: 0 -0.63px; }
#gs .axes { transition: opacity 300ms ease; }
#gs:not([data-step="g1"]) .axes { opacity: 0; }
@keyframes fadeOnly { from { opacity: 0; } }

/* g1: 대지가 아래에서 밀려 들어온 뒤 → X 화살표가 그려지며 지나가는 칸마다 세로 칸이 아래로 → Y 와 가로 줄 */
#stage.ready #gs[data-step="g1"] #gb { animation: boardIn 800ms var(--ease) both; }
@keyframes boardIn { from { opacity: 0; translate: 0 120px; } }
#stage.ready #gs[data-step="g1"] .lx { animation: fadeOnly 300ms ease 700ms both; }
#stage.ready #gs[data-step="g1"] .ax { animation: drawX 1100ms linear 900ms both; }
@keyframes drawX { from { width: 0; } }
#stage.ready #gs[data-step="g1"] .col { animation: drop 700ms var(--ease) both; animation-delay: calc(var(--d) + 700ms); }
@keyframes drop { from { height: 0; } }
#stage.ready #gs[data-step="g1"] .ltime { animation: fadeOnly 300ms ease 2000ms both; }
#stage.ready #gs[data-step="g1"] .ly { animation: fadeOnly 300ms ease 2200ms both; }
#stage.ready #gs[data-step="g1"] .ay { animation: drawY 800ms linear 2300ms both; }
@keyframes drawY { from { height: 0; } }
#stage.ready #gs[data-step="g1"] .row { animation: spread 700ms var(--ease) both; animation-delay: calc(var(--d) + 700ms); }
@keyframes spread { from { width: 0; } }
#stage.ready #gs[data-step="g1"] .ldepth { animation: fadeOnly 300ms ease 3100ms both; }

/* g2: 완성된 그리드가 맥락에 따라 천천히 줄었다 늘었다 (쫀득한 ease-in-out) 하다가 2번 그리드로 */
#stage.ready #gs[data-step="g2"] .row { animation: var(--k) 4200ms linear 200ms both; }
#stage.ready #gs[data-step="g2"] .col { animation: var(--k) 4200ms linear 200ms both; } /* 가로·세로가 같은 박자로 바뀜 */
@keyframes row1 {
  0% { top: 40px; height: 138px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  25% { top: 40px; height: 90px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  50% { top: 40px; height: 170px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  75% { top: 40px; height: 50px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  100% { top: 40px; height: 60px; }
}
@keyframes row2 {
  0% { top: 190px; height: 138px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  25% { top: 142px; height: 190px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  50% { top: 222px; height: 80px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  75% { top: 102px; height: 160px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  100% { top: 113px; height: 151px; }
}
@keyframes row3 {
  0% { top: 340px; height: 138px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  25% { top: 344px; height: 100px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  50% { top: 314px; height: 180px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  75% { top: 274px; height: 120px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  100% { top: 282px; height: 130px; }
}
@keyframes row4 {
  0% { top: 490px; height: 138px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  25% { top: 456px; height: 160px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  50% { top: 506px; height: 95px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  75% { top: 406px; height: 150px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  100% { top: 430px; height: 130px; }
}
@keyframes col1 {
  0% { left: 27px; width: 236px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  25% { left: 27px; width: 200px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  50% { left: 27px; width: 270px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  75% { left: 27px; width: 250px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }
  100% { left: 27px; width: 236px; }
}
@keyframes col2 {
  0% { left: 277px; width: 236px; animation-timing-function: cubic-bezier(.83, 0, .17, 1); }

@keyframes swipe {
  from { -webkit-mask-position: 100% 0; mask-position: 100% 0; translate: -10px 0; }
  to { -webkit-mask-position: 0 0; mask-position: 0 0; translate: 0 0; }
}
@keyframes dress { from { opacity: 0; scale: .97; } }

<script>
// 피그마 수치 그대로: [변화없음 높이, 부정 높이, 퍼센트 글자, 퍼센트 x, 퍼센트 y]
const COLS = [
  { label: ['작업 속도', '협업 속도'],       s: [[0, 0, '100%', 16, 12],          [34.588, 22, '', 16, 12]] },
  { label: ['결과물 완성도', '결과물 완성도'], s: [[28, 0, '86.7%', 19.765, 12],     [64.235, 13.176, '', 19.765, 12]] },
  { label: ['정보 이해', '의견 조율'],       s: [[28, 13.176, '83.3%', 13, 12],    [100.471, 13.176, '56.6%', 7, 74.582]] },
  { label: ['아이디어 발상', '아이디어 교류'], s: [[52.706, 13.176, '66.7%', 19.765, 12], [98, 26, '60.0%', 19.765, 64]] },
  { label: ['문제 해결', '공동 문제 해결'],   s: [[44.471, 31.294, '70%', 19.765, 12], [111, 13, '60.0%', 19.765, 64]] },
];
const TEXT_LEAD = 320, STAGGER = 90; // 글자가 먼저, 그다음 그래프가 왼쪽부터 STAGGER 간격으로

// 두 글자열에서 앞뒤 공통 부분은 고정, 가운데 바뀐 부분만 .swap 으로 감싼다
const chars = t => [...t].map((c, i) => `<span class="ch" style="--i:${i}">${c}</span>`).join('');
function diffMarkup(a, b) {
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let q = 0; while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
  const am = a.slice(p, a.length - q), bm = b.slice(p, b.length - q);
  if (!am && !bm) return a;
  return a.slice(0, p) + `<span class="swap"><span class="on">${chars(am)}</span><span>${chars(bm)}</span></span>` + a.slice(a.length - q);
}

const chart = document.getElementById('chart');
chart.innerHTML = COLS.map((c, i) => `
  <div class="col" style="--d:${TEXT_LEAD + i * STAGGER}ms">
    <div class="bars"><div class="seg p"></div><div class="seg n"></div><div class="seg m"></div></div>
    <p class="label">${diffMarkup(c.label[0], c.label[1])}</p>
    <p class="pct">${diffMarkup(c.s[0][2], c.s[1][2])}</p>
  </div>`).join('');
// 제목은 굵기가 섞여 있어 직접 적은 마크업의 글자만 쪼갬
document.querySelectorAll('.title .swap > span').forEach(sp => {
  let i = 0;
  const walk = n => [...n.childNodes].forEach(c => c.nodeType === 3
    ? c.replaceWith(document.createRange().createContextualFragment([...c.data].map(ch => `<span class="ch" style="--i:${i++}">${ch}</span>`).join('')))
    : walk(c));
  walk(sp);
});


// 바뀐 부분의 폭만 바꿔서 뒤따르는 공통 글자가 자연스럽게 자리 이동
const stage = document.getElementById('stage');
function fitSwaps(state) {
  const k = stage.getBoundingClientRect().width / 1920;
  document.querySelectorAll('#chartSlide .swap').forEach(sw => {
    [...sw.children].forEach((c, n) => c.classList.toggle('on', n === state));
    sw.style.width = sw.children[state].getBoundingClientRect().width / k + 'px';
  });
}

function setChart(state) {
  document.getElementById('chartSlide').dataset.state = state;
  [...chart.children].forEach((col, i) => {
    const [n, m, , x, y] = COLS[i].s[state];
    const [p, nEl, mEl] = col.querySelectorAll('.seg');
    p.style.bottom = (n + m) + 'px';
    nEl.style.bottom = m + 'px'; nEl.style.height = n + 'px';
    mEl.style.height = m + 'px';
    Object.assign(col.querySelector('.pct').style, { left: x + 'px', top: y + 'px', color: state ? 'var(--blue)' : '' });
  });
  fitSwaps(state);
}

// 장 구성: 0·1 은 같은 차트 화면의 두 상태, 2 는 별도 화면
const N = 11; // 0·1 차트, 2 인사이트, 3~6 그리드 시스템, 7 관계맵 개요(안건), 8 관계맵 소개(안건1 줌인), 9 관계맵, 10 관계맵 흐름(카드 선택)
// 새로고침하면 맨 첫 장, 주소의 #번호로 열면 그 장
const reloaded = performance.getEntriesByType('navigation')[0]?.type === 'reload';
let cur = reloaded ? 0 : Math.min(Math.max(+location.hash.slice(1) - 1 || 0, 0), N - 1);
const chartSlide = document.getElementById('chartSlide'), s3 = document.getElementById('s3'), map = document.getElementById('map');
const MAP_STEP = { 7: 'ov', 8: 'intro', 9: 'full', 10: 'flow' }, GRID_STEP = { 3: 'g1', 4: 'g2', 5: 'g3', 6: 'g4' };
const grid = document.getElementById('gs');
let cutTimer;
function show(n) { chartSlide.classList.toggle('on', n < 2); s3.classList.toggle('on', n === 2); grid.classList.toggle('on', n >= 3 && n <= 6); map.classList.toggle('on', n >= 7); chartSlide.classList.remove('stretch'); }
function setStep(el, step, snap) {
  el.classList.toggle('snap', snap);
  el.dataset.step = ''; el.offsetWidth; // 같은 장으로 돌아와도 애니메이션을 처음부터 다시
  el.dataset.step = step;
  el.offsetWidth; requestAnimationFrame(() => el.classList.remove('snap'));
}
// 관계 맵 마지막 장: 원문을 재생 중인 상태 — 시간 숫자가 1초씩 늘고 진행 막대가 계속 오른쪽으로
let playTimer;
function play(on, delay) {
  clearInterval(playTimer);
  const bar = document.querySelector('#left .pbar'), time = document.querySelector('#left .ptime');
  bar.style.width = '103.8px'; time.textContent = '4:41';
  if (!on) return;
  const t0 = performance.now() + delay;
  playTimer = setInterval(() => {
    const e = Math.max(0, performance.now() - t0) / 1000;
    const sec = 281 + Math.floor(e);
    time.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    bar.style.width = Math.min(416.35, 103.8 + e * 3) + 'px'; // ponytail: 막대는 실제 비율(1초 0.08px) 대신 눈에 보이게 1초 3px
  }, 50);
}
function go(i, animate = true) {
  const prev = cur;
  cur = Math.min(Math.max(i, 0), N - 1);
  clearTimeout(cutTimer);
  if (cur === 2 && prev === 1 && animate) {
    chartSlide.classList.add('stretch');            // 그래프가 위로 늘어난 뒤
    cutTimer = setTimeout(() => show(2), 200);      // 트랜지션 없이 3 으로 컷
  } else show(cur);
  if (GRID_STEP[cur]) setStep(grid, GRID_STEP[cur], !animate);
  map.classList.toggle('zin', prev === 7 && cur === 8);   // 안건 1 로 줌인
  map.classList.toggle('zout', prev === 8 && cur === 7);  // 다시 안건 카드로 줌아웃
  play(MAP_STEP[cur] === 'flow', animate ? 4900 : 0);
  if (MAP_STEP[cur]) setStep(map, MAP_STEP[cur], !animate || prev < 7); // 관계 맵으로 처음 들어올 땐 바로 그 상태로
  if (cur < 2) setChart(cur);
  history.replaceState(null, '', '#' + (cur + 1));
}
go(cur, false);

addEventListener('click', () => { go(cur + 1); stage.classList.add('ready'); });
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) go(cur + 1);
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) go(cur - 1);
  else return e.key === 'f' ? (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen())
    : e.key === 'g' && stage.classList.toggle('grid');
  stage.classList.add('ready'); // 첫 화면에서는 글자 쓰기 애니메이션 생략
});

const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
addEventListener('resize', fit); fit();
// 폰트가 늦게 로드되면 폭을 다시 잼 (첫 측정이 대체 글꼴 기준일 수 있음)
document.fonts.ready.then(() => {
  const sw = document.querySelectorAll('.swap');
  sw.forEach(e => e.style.transition = 'none'); fitSwaps(Math.min(cur, 1));
  stage.offsetWidth; sw.forEach(e => e.style.transition = '');
});
</script>
